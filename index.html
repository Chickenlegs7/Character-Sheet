<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18282c"><title>Thalminaras Low Fantasy Character Sheet</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eee8dc;background:#10191c}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;color:#172324;background:#d2aa6b;font-weight:700}button.secondary{background:#344b4d;color:#eee8dc}button.danger{background:#633b3c;color:#fff}button:disabled{opacity:.45}input,select,textarea{background:#14272a;color:#f6f1e5;border:1px solid #4a6060;border-radius:9px;padding:9px;width:100%;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #d2aa6b}textarea{min-height:90px;resize:vertical}label{display:block;color:#b9c8c1;font-size:12px;font-weight:700}label>input,label>select,label>textarea{margin-top:5px}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:27px;margin:3px 0}h2{font-size:22px;color:#eed2a2;margin:0}h3{font-size:17px;color:#e5ca9a;margin:0 0 10px}p{line-height:1.45}.muted{color:#a8b6b1;font-size:12px}.top{padding:15px max(16px,calc((100vw - 900px)/2));border-bottom:1px solid #52605a;background:#18282c}.brand{color:#d7ae72;text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:800}.headrow{display:flex;gap:12px;align-items:center}.headrow>div{flex:1;min-width:0}.headrow select{width:125px;font-size:12px}.subhead{color:#acbfb8;font-size:13px}.wrap{max-width:900px;margin:auto;padding:16px 16px 95px}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#17292ceF;border-top:1px solid #536359;display:flex;overflow-x:auto;gap:3px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none}.tabs button{background:transparent;color:#aebeb7;white-space:nowrap;flex:1;min-width:70px;padding:10px 6px;font-size:11px}.tabs button.active{background:#425147;color:#ffdfaa}.panel{display:none}.panel.active{display:block}.card{border:1px solid #405558;background:#1d3033;border-radius:15px;padding:16px;margin:0 0 13px}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.cardhead button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.item{border:1px solid #40565a;background:#14262a;border-radius:12px;padding:12px;margin:9px 0}.itemtitle{font-weight:750;color:#f0d6a6;margin-bottom:8px}.stat{background:#14262a;border:1px solid #3e5659;border-radius:10px;padding:10px}.stat strong{font-size:21px;color:#e7c48f}.stat label{font-size:11px}.stat input{text-align:center}.pill{display:inline-block;background:#344c46;color:#e4d4b7;border-radius:99px;padding:4px 8px;font-size:11px}.fieldrow{margin:10px 0}.bar{height:7px;background:#344447;border-radius:9px;overflow:hidden;margin:10px 0}.bar span{display:block;background:#d0a96f;height:100%}.chiprow{display:flex;gap:6px;flex-wrap:wrap}.chiprow button{padding:7px 10px;font-size:12px;background:#354a4c;color:#ddd}.chiprow button.active{background:#cda569;color:#1a2524}.result{border-left:3px solid #d0aa72;background:#27393a;padding:10px 12px;margin:12px 0;border-radius:7px;min-height:38px}.empty{color:#9aada8;font-size:13px;padding:9px 0}.note{padding:10px 12px;border-left:3px solid #947a55;background:#26383a;border-radius:7px;font-size:12px;color:#c4d0c9;margin:10px 0}.footer{color:#8fa4a0;font-size:11px;margin:20px 0}.slotgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.slot{background:#14262a;border:1px solid #3e5659;padding:10px;border-radius:10px}.slot small{color:#a7b7b1}.hidden{display:none!important}@media(min-width:720px){.wrap{padding-bottom:30px}.tabs{position:sticky;top:0;bottom:auto;max-width:900px;margin:auto;border:1px solid #536359;border-radius:0 0 12px 12px}.tabs button{font-size:13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}.twocol>.card{align-self:start}.slotgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){.row{flex-wrap:wrap}.row>label{flex:1 1 100px}.row>button{flex:0 0 auto}.grid.three .stat{padding:7px}.grid.three .stat button{width:100%;padding:8px 3px;font-size:11px}}

</style></head><body>
<header class="top"><div class="brand">Thalminaras • Low Fantasy</div><div class="headrow"><div><h1 id="displayName">Character Sheet</h1><div class="subhead" id="subtitle"></div></div></div></header>
<nav class="tabs" aria-label="Sheet tabs"><button data-tab="combat" class="active">Combat</button><button data-tab="skills">Skills</button><button data-tab="inventory">Inventory</button><button data-tab="equipment">Equipment</button><button data-tab="notes">Notes</button><button data-tab="character">Character</button><button data-tab="talents">Talents</button><button data-tab="professions">Professions</button></nav>
<main class="wrap">
<section class="panel active" id="combat"></section><section class="panel" id="skills"></section><section class="panel" id="inventory"></section><section class="panel" id="equipment"></section><section class="panel" id="notes"></section><section class="panel" id="character"></section><section class="panel" id="talents"></section><section class="panel" id="professions"></section>
<p class="footer">Your edits save in this browser on this device. Export backups regularly. This standalone phone sheet does not update Foundry automatically.</p>
</main><input type="file" id="importFile" accept=".json,application/json" hidden><script>
(()=>{'use strict';
const LEGACY_SLOTS=['mortash','onyxar','harvey','player4'];
const SKILLS={weapons:['One Handed Edged Weapons','Two Handed Edged Weapons','One Handed Blunt Weapons','Two Handed Blunt Weapons','Unarmed Combat','Ranged Weapons'],armor:['Light Armor','Medium Armor','Heavy Armor','Shield'],athletic:['Riding','Parkour','Swimming','Climbing','Grappling','Stealth','Pickpocketing','Finesse'],social:['Persuasion','Guile','Encourage','Leadership','Instruments','Dance','Coercion'],survival:['Awareness','Pathfinding','Discernment','Beast Mastery','Medicine'],knowledge:['Magic Sense','Memory','Arcane Knowledge','Casting']};
const RANKS={None:[0,150],Beginner:[1,100],Apprentice:[2,250],Intermediate:[3,600],Experienced:[4,1400],Adept:[5,3200],Master:[7,6400],'Grand Master':[10,6400]};
const ATTRS=['strength','agility','vitality','intellect','toughness','willpower'];
const ANCESTRY_INJ={'Wood Elf':3,Human:3,Quarrin:4,Foxlin:3,Aquaris:3,Dwarf:4,'Half-Orc':4};
const SLOTS_EQUIP=['helmet','chest','pants','mainhand','offhand','necklace','ring1','ring2','ring3','ring4','trinket1','trinket2'];
const $=s=>document.querySelector(s), n=(v,d=0)=>v===''||v==null?d:(Number.isFinite(Number(v))?Number(v):d), clamp=(v,min,max)=>Math.min(max,Math.max(min,v)), uid=()=>crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(obj,path)=>path.split('.').reduce((v,k)=>v?.[k],obj), set=(obj,path,value)=>{const parts=path.split('.');let x=obj;for(const k of parts.slice(0,-1)){if(!x[k]||typeof x[k]!=='object')x[k]={};x=x[k]}x[parts.at(-1)]=value};
const key=()=> 'thalminaras-phone-v3:character';
function fresh(){const name='New Character',ancestry='Human';return {schema:2,name,mode:'lowFantasy',identity:{level:1,experience:0,ancestry,class:'',background:'',homeland:''},character:{age:'',height:'',weight:'',passiveAwareness:0,liftingCapacity:'',appearance:'',personality:'',goals:'',connections:'',biography:'',racialPassives:[],advantages:[],weaknesses:[]},points:{skill:0,attribute:0,talent:0},stats:Object.fromEntries(ATTRS.map(a=>[a,{level:10,bonus:0}])),combat:{rollMode:'normal',initiative:0,movementSpeed:30,passiveDefense:8,parryDie:'d6',parrySkill:0,blockDie:'d6',blockSkill:0,dodgeDie:'d6',dodgeSkill:0,fatigue:{physical:0,magical:0},ammunition:[]},resources:{mana:{value:0,max:0,recovery:0},focus:{value:0,max:0,recovery:0},actionPoints:{value:3,max:3}},lowFantasy:{previousAncestry:'',injuries:{current:0,limit:ANCESTRY_INJ[ancestry]},defense:{armorRating:0,bonusDR:0},incomingDamage:0},skills:Object.fromEntries(Object.values(SKILLS).flat().map(x=>[x,{level:'None',current:0,max:150,bonus:0,miscBonus:0}])),attacks:[],inventory:{capacity:10,eversteelShards:0,items:[]},equipment:Object.fromEntries(SLOTS_EQUIP.map(x=>[x,null])),notes:[],talents:[],professions:{major:{},minor:{}}}}
function merge(base,raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))return base;for(const [k,v] of Object.entries(raw)){if(k==='__proto__'||k==='constructor'||k==='prototype')continue;if(Array.isArray(v))base[k]=v;else if(v&&typeof v==='object'){if(!base[k]||typeof base[k]!=='object'||Array.isArray(base[k]))base[k]={};merge(base[k],v)}else if(['string','number','boolean'].includes(typeof v))base[k]=v}return base}
let state;let active='combat';let category='weapons';let skillSearch='';let talentSearch='';let result='';
function lowFantasyOnly(){state.mode='lowFantasy';delete state.resources.health;for(const field of ['physicalArmor','elementalArmor','cosmicArmor'])delete state.combat[field];for(const item of state.inventory.items||[])if(item.equippedSlot&&!SLOTS_EQUIP.includes(item.equippedSlot))item.equippedSlot=''}
function load(){try{let stored=localStorage.getItem(key());if(!stored){const requested=new URLSearchParams(location.search).get('character');const order=[requested,...LEGACY_SLOTS].filter((x,i,a)=>LEGACY_SLOTS.includes(x)&&a.indexOf(x)===i);for(const oldSlot of order){stored=localStorage.getItem('thalminaras-phone-v2:'+oldSlot);if(stored)break}}const raw=stored?JSON.parse(stored):null;state=merge(fresh(),raw?.schema===2?raw:null);delete state.slot;lowFantasyOnly();if(stored&&!localStorage.getItem(key()))save()}catch{state=fresh()}}
function save(){try{localStorage.setItem(key(),JSON.stringify(state))}catch{result='Storage unavailable. Export a backup.'}}
function input(path,label,type='text',extra=''){return `<label>${esc(label)}<input type="${type}" data-path="${esc(path)}" value="${esc(get(state,path))}" ${extra}></label>`}
function area(path,label){return `<label>${esc(label)}<textarea data-path="${esc(path)}">${esc(get(state,path))}</textarea></label>`}
function select(path,label,options){const val=get(state,path);return `<label>${esc(label)}<select data-path="${esc(path)}">${options.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function card(title,body,action=''){return `<div class="card"><div class="cardhead"><h2>${title}</h2>${action}</div>${body}</div>`}
function btn(action,text,attrs='',cls='secondary'){return `<button class="${cls}" data-act="${action}" ${attrs}>${text}</button>`}
function totalBonus(skill){return n(skill.bonus)+n(skill.miscBonus)}
function resource(name,title){const r=state.resources[name];return `<div class="item"><div class="itemtitle">${title} <span class="pill">${n(r.value)} / ${n(r.max)}</span></div><div class="grid">${input(`resources.${name}.value`,'Current','number','min="0"')}${input(`resources.${name}.max`,'Maximum','number','min="0"')}</div><div class="bar"><span style="width:${clamp(r.max?100*r.value/r.max:0,0,100)}%"></span></div><div class="chiprow">${btn('resource-step','−1',`data-name="${name}" data-delta="-1"`)}${btn('resource-step','+1',`data-name="${name}" data-delta="1"`)}</div></div>`}
function dice(formula){let text=String(formula||'').replace(/\s+/g,'').replace(/@stats\.(strength|agility|vitality|intellect|toughness|willpower)\.bonus/gi,(_,a)=>String(n(state.stats[a.toLowerCase()]?.bonus)));if(!/^[+\-\dD]+$/i.test(text)||text.length>80)throw Error('Use dice such as 2d10+3 or 1d8+2');let parts=text.match(/[+-]?[^+-]+/g);if(!parts)throw Error('Invalid dice');let total=0,detail=[];for(const part of parts){let sign=part.startsWith('-')?-1:1,s=part.replace(/^[+-]/,'');let m=s.match(/^(\d{0,2})d(\d{1,3})$/i);if(m){const count=m[1]?n(m[1]):1,sides=n(m[2]);if(count<1||count>30||sides<2||sides>1000)throw Error('Dice limit exceeded');const arr=new Uint32Array(count);crypto.getRandomValues(arr);let rolls=Array.from(arr,x=>x%sides+1);total+=sign*rolls.reduce((a,b)=>a+b,0);detail.push(`${sign<0?'-':''}${rolls.join('+')}`)}else if(/^\d+$/.test(s)){total+=sign*n(s);detail.push(part)}else throw Error('Invalid dice term')}return {total,detail:detail.join(' + ')}}
function combatRoll(formula){const mode=state.combat.rollMode,text=String(formula||'2d10');if(mode==='normal')return dice(text);const match=text.match(/(\d+)d(\d+)/i);if(!match)return dice(text);const count=n(match[1]),sides=n(match[2]);if(count<1||count>29||sides<2||sides>1000)throw Error('Dice limit exceeded');const arr=new Uint32Array(count+1);crypto.getRandomValues(arr);const rolls=Array.from(arr,x=>x%sides+1),sorted=[...rolls].sort((a,b)=>a-b),kept=mode==='advantage'?sorted.slice(1):sorted.slice(0,count),subtotal=kept.reduce((a,b)=>a+b,0);const remainder=dice(text.replace(match[0],String(subtotal)));return{total:remainder.total,detail:`${count+1}d${sides} [${rolls.join(', ')}], kept ${kept.join('+')}${remainder.detail===String(subtotal)?'':` + ${remainder.detail}`}`}}
function roll(label,formula,bonus=0,combat=false){try{const d=combat?combatRoll(formula):dice(formula);result=`${label}: ${d.total+n(bonus)} (${d.detail}${bonus?` ${bonus>=0?'+':'−'} ${Math.abs(bonus)}`:''})`}catch(e){result=e.message}render(active)}
function renderCombat(){const c=state.combat,lf=state.lowFantasy,inj=lf.injuries,dr=n(state.stats.toughness.bonus)*2+n(lf.defense.bonusDR),dt=n(lf.defense.armorRating)*2+dr;
const mode=card('Combat roll mode',`<p class="muted">Applies to hit and initiative rolls.</p><div class="chiprow">${['disadvantage','normal','advantage'].map(x=>btn('mode',x,`data-value="${x}"`,c.rollMode===x?'':'secondary')).join('')}</div>`);
const defs=card('Defense',`<div class="grid">${input('combat.passiveDefense','Passive Defense','number')}${input('combat.movementSpeed','Movement (ft)','number')}${input('combat.initiative','Initiative bonus','number')}${btn('roll-initiative','Roll initiative','','')}</div><p class="muted">Passive Defense is set manually in the Foundry sheet. A hit must exceed it.</p><div class="grid three">${['parry','block','dodge'].map(x=>`<div class="stat"><strong>${x[0].toUpperCase()+x.slice(1)}</strong>${select(`combat.${x}Die`,'Die',['d6','d8','d10','d12','2d6'])}${input(`combat.${x}Skill`,'Bonus','number')}${btn('defense','Roll',`data-type="${x}"`,'')}</div>`).join('')}</div>`);
const resources=card('Injuries & resources',`<div class="item"><div class="itemtitle">Injuries <span class="pill">Penalty −${n(inj.current)}</span></div><div class="grid">${input('lowFantasy.injuries.current','Current','number','min="0"')}${input('lowFantasy.injuries.limit','Limit','number','min="0"')}</div><p class="muted">Each Injury gives −1 to attacks, skills, and Active Defense. Exceeding the limit calls for Last Stand.</p>${state.identity.ancestry.toLowerCase()==='veilborn'?input('lowFantasy.previousAncestry','Previous ancestry'):''}</div>${resource('mana','Mana')}${input('resources.mana.recovery','Mana recovery','number')}${resource('focus','Focus')}${input('resources.focus.recovery','Focus recovery','number')}${resource('actionPoints','Action Points')}<div class="actions">${btn('round','New round')}${btn('rest','Full rest')}</div>`);
const arm=card('Armor & Damage Threshold',`<div class="grid">${input('lowFantasy.defense.armorRating','Armor Rating','number','step="0.5"')}${input('lowFantasy.defense.bonusDR','Bonus DR','number')}<div class="stat"><label>Armor DT</label><strong>${n(lf.defense.armorRating)*2}</strong></div><div class="stat"><label>Toughness DR</label><strong>${n(state.stats.toughness.bonus)*2}</strong></div><div class="stat"><label>Total DR</label><strong>${dr}</strong></div><div class="stat"><label>Final DT</label><strong>${dt}</strong></div></div><div class="item"><h3>Apply incoming damage</h3><div class="row">${input('lowFantasy.incomingDamage','Damage','number','min="0"')}${btn('apply-damage','Apply',`data-dt="${dt}"`,'')}</div><p class="muted">Damage at or below DT gives 0 Injuries; above DT gives 1, plus 1 per additional 5 damage.</p></div>`);
const attacks=card('Attacks',`${state.attacks.length?state.attacks.map((a,i)=>`<div class="item"><div class="row">${input(`attacks.${i}.name`,'Name')}${btn('remove','×',`data-list="attacks" data-index="${i}"`,'danger')}</div><div class="grid">${input(`attacks.${i}.hitFormula`,'Hit dice')}${input(`attacks.${i}.hitModifier`,'Hit bonus','number')}${input(`attacks.${i}.damageFormula`,'Damage dice')}${input(`attacks.${i}.description`,'Description')}</div><div class="actions">${btn('attack','Roll hit',`data-index="${i}"`,'')}${btn('damage','Roll damage',`data-index="${i}"`)}</div></div>`).join(''):'<div class="empty">No attacks entered.</div>'}`,btn('add','+ Add',`data-list="attacks"`));
const ammo=card('Ammunition',`${c.ammunition.map((a,i)=>`<div class="item row">${input(`combat.ammunition.${i}.name`,'Type')}${input(`combat.ammunition.${i}.count`,'Count','number')}${btn('ammo-step','−',`data-index="${i}" data-delta="-1"`)}${btn('ammo-step','+',`data-index="${i}" data-delta="1"`)}${btn('remove','×',`data-list="combat.ammunition" data-index="${i}"`,'danger')}</div>`).join('')||'<div class="empty">No ammunition tracked.</div>'}`,btn('add','+ Add',`data-list="combat.ammunition"`));
const fatigue=card('Fatigue',`<div class="grid">${['physical','magical'].map(x=>`<div class="stat"><label>${x} fatigue</label><strong>${n(c.fatigue[x])}</strong><div class="chiprow">${btn('fatigue','−',`data-type="${x}" data-delta="-1"`)}${btn('fatigue','+',`data-type="${x}" data-delta="1"`)}</div></div>`).join('')}</div>`);
return mode+`<div class="twocol"><div>${defs}${arm}${fatigue}</div><div>${resources}${ammo}</div></div>`+attacks}
function renderSkills(){const found=SKILLS[category].filter(x=>x.toLowerCase().includes(skillSearch.toLowerCase()));return card('Skills',`<p class="muted">Foundry roll: 2d10 + Skill bonus + Misc bonus. Rank sets the base skill bonus and progress target.</p><div class="chiprow">${Object.keys(SKILLS).map(x=>btn('category',x,`data-value="${x}"`,category===x?'':'secondary')).join('')}</div><label class="fieldrow">Find skill<input id="skillSearch" value="${esc(skillSearch)}" placeholder="Search this category"></label>${found.map(name=>{const s=state.skills[name];return `<div class="item"><div class="itemtitle">${esc(name)}</div><div class="grid">${select(`skills.${name}.level`,'Rank',Object.keys(RANKS))}${input(`skills.${name}.bonus`,'Skill bonus','number')}${input(`skills.${name}.miscBonus`,'Misc bonus','number')}${input(`skills.${name}.current`,'Progress','number','min="0"')}${input(`skills.${name}.max`,'Target','number','min="1"')}<div><label>Total</label><div class="stat"><strong>${totalBonus(s)>=0?'+':''}${totalBonus(s)}</strong></div></div></div><div class="bar"><span style="width:${clamp(n(s.current)/Math.max(1,n(s.max))*100,0,100)}%"></span></div><div class="actions">${btn('skill','Roll 2d10',`data-name="${esc(name)}"`,'')}${btn('advance','Advance rank',`data-name="${esc(name)}" ${n(s.current)<n(s.max)?'disabled':''}`)}</div></div>`}).join('')||'<div class="empty">No matching skills.</div>'}`)}
function renderInventory(){const inv=state.inventory;return card('Inventory',`<div class="grid">${input('inventory.eversteelShards','Eversteel Shards','number','min="0"')}${input('inventory.capacity','Item slots','number','min="0"')}</div><p class="muted">${inv.items.length} / ${n(inv.capacity)} slots used</p>${inv.items.map((it,i)=>`<div class="item"><div class="row">${input(`inventory.items.${i}.name`,'Item')}${btn('remove','×',`data-list="inventory.items" data-index="${i}"`,'danger')}</div><div class="grid">${input(`inventory.items.${i}.quantity`,'Quantity','number','min="0"')}${input(`inventory.items.${i}.type`,'Type')}${input(`inventory.items.${i}.description`,'Details')}${select(`inventory.items.${i}.equippedSlot`,'Equipped slot',['',...SLOTS_EQUIP])}</div></div>`).join('')||'<div class="empty">No items entered.</div>'}`,btn('add','+ Item',`data-list="inventory.items"`))}
function renderEquipment(){const items=state.inventory.items;return card('Equipment',`<p class="muted">Choose an inventory item for each slot. The Foundry silhouette becomes a touch friendly slot list.</p><div class="slotgrid">${SLOTS_EQUIP.map(x=>`<div class="slot"><small>${esc(x.replace(/([0-9])/,' $1'))}</small><select data-equip="${x}"><option value="">Empty</option>${items.map((it,i)=>`<option value="${i}" ${it.equippedSlot===x?'selected':''}>${esc(it.name||'Unnamed item')}</option>`).join('')}</select></div>`).join('')}</div><div class="note">Gem sockets can be recorded in an item's Details for now. The Foundry drag and drop socket manager needs its item data and assets for a faithful conversion.</div>`)}
function renderNotes(){return card('Adventure Journal',`${state.notes.map((x,i)=>`<div class="item"><div class="row">${input(`notes.${i}.title`,'Title')}${btn('remove','×',`data-list="notes" data-index="${i}"`,'danger')}</div>${area(`notes.${i}.body`,'Entry')}</div>`).join('')||'<div class="empty">No notes yet.</div>'}`,btn('add','+ Note',`data-list="notes"`))}
function renderCharacter(){const ch=state.character;return card('Identity',`<div class="grid">${input('name','Character name')}${input('identity.ancestry','Race / ancestry')}${input('identity.class','Current build')}${input('identity.background','Background')}${input('identity.homeland','Homeland')}${input('identity.level','Level','number','min="1"')}${input('identity.experience','Total XP','number','min="0"')}${input('points.skill','Skill points','number')}${input('points.attribute','Attribute points','number')}${input('character.age','Age')}${input('character.height','Height')}${input('character.weight','Weight')}</div>`)+card('Core attributes',`<div class="grid three">${ATTRS.map(x=>`<div class="stat"><h3>${x[0].toUpperCase()+x.slice(1)}</h3>${input(`stats.${x}.level`,'Level','number')}${input(`stats.${x}.bonus`,'Bonus','number')}${btn('attribute','Roll',`data-type="${x}"`)}</div>`).join('')}</div>`)+card('Passive statistics',`<div class="grid">${input('character.passiveAwareness','Passive Awareness','number')}${input('character.liftingCapacity','Lifting capacity')}</div>`)+card('Personality & history',`${area('character.appearance','Appearance')}${area('character.personality','Personality')}${area('character.goals','Goals')}${area('character.connections','Connections')}${area('character.biography','Biography')}`)+['racialPassives','advantages','weaknesses'].map(group=>card(group.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase()),`${ch[group].map((x,i)=>`<div class="item"><div class="row">${input(`character.${group}.${i}.name`,'Name')}${btn('remove','×',`data-list="character.${group}" data-index="${i}"`,'danger')}</div>${area(`character.${group}.${i}.description`,'Description')}</div>`).join('')||'<div class="empty">None listed.</div>'}`,btn('add','+ Add',`data-list="character.${group}"`))).join('')+card('Backups',`<div class="actions">${btn('export','Export backup','','')}${btn('import','Import JSON')}${btn('reset','Reset character','','danger')}</div><p class="muted">Import accepts this sheet's backup or a Foundry Actor JSON export. Import replaces this device's character after confirmation.</p>`)}
function renderTalents(){return card('Talent Tree',`<div class="grid">${input('points.talent','Available talent points','number')}<div class="stat"><label>Unlocked</label><strong>${state.talents.filter(x=>x.unlocked).length} / ${state.talents.length}</strong></div></div><label class="fieldrow">Find talent<input id="talentSearch" value="${esc(talentSearch)}" placeholder="Search talents"></label>${state.talents.map((t,i)=>({t,i})).filter(({t})=>String(t.name||'').toLowerCase().includes(talentSearch.toLowerCase())).map(({t,i})=>`<div class="item"><div class="row">${input(`talents.${i}.name`,'Talent')}${btn('remove','×',`data-list="talents" data-index="${i}"`,'danger')}</div><div class="grid">${input(`talents.${i}.cost`,'Cost','number')}${input(`talents.${i}.branch`,'Branch')}${input(`talents.${i}.requiredLevel`,'Required level','number')}${input(`talents.${i}.prerequisite`,'Prerequisite')}</div>${area(`talents.${i}.description`,'Effect')}<div class="actions">${btn('unlock',t.unlocked?'Unlocked ✓':'Unlock',`data-index="${i}"`,t.unlocked?'secondary':'')}</div></div>`).join('')||'<div class="empty">No talents listed yet. Add one, or import a Foundry actor with talent nodes.</div>'}`,btn('add','+ Talent',`data-list="talents"`))}
function renderProfessions(){return card('Professions',`<p class="muted">Major and Minor professions from the Foundry sheet, with trade skill progression and learned recipes.</p>${['major','minor'].map(x=>{const p=state.professions[x]||{},recipes=Array.isArray(p.recipes)?p.recipes:[];return `<div class="item"><h3>${x[0].toUpperCase()+x.slice(1)} profession</h3><div class="grid">${['name','type','title','level','specializations','tools'].map(f=>input(`professions.${x}.${f}`,f.replace(/([A-Z])/g,' $1'),f==='level'?'number':'text')).join('')}</div><h3>Trade skill</h3><div class="grid">${select(`professions.${x}.skillLevel`,'Rank',Object.keys(RANKS))}${input(`professions.${x}.skillCurrent`,'Progress','number')}${input(`professions.${x}.skillMax`,'Target','number')}${input(`professions.${x}.skillBonus`,'Skill bonus','number')}${input(`professions.${x}.miscBonus`,'Misc bonus','number')}</div><div class="actions">${btn('profession','Roll trade skill',`data-type="${x}"`,'')}</div>${area(`professions.${x}.notes`,'Notes')}<div class="cardhead"><h3>Recipes</h3>${btn('recipe-add','+ Add',`data-type="${x}"`)}</div>${recipes.map((r,i)=>`<div class="slot"><div class="row">${input(`professions.${x}.recipes.${i}.name`,'Recipe')}${btn('recipe-remove','×',`data-type="${x}" data-index="${i}"`,'danger')}</div>${input(`professions.${x}.recipes.${i}.level`,'Required level','number')}${area(`professions.${x}.recipes.${i}.description`,'Details')}</div>`).join('')||'<div class="empty">No recipes entered.</div>'}</div>`}).join('')}`)}
function render(which){active=which||active;$('#displayName').textContent=state.name||'New Character';$('#subtitle').textContent=`${state.identity.ancestry||'Unknown ancestry'} · Level ${n(state.identity.level,1)} · Low Fantasy`;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===active));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===active));const fn={combat:renderCombat,skills:renderSkills,inventory:renderInventory,equipment:renderEquipment,notes:renderNotes,character:renderCharacter,talents:renderTalents,professions:renderProfessions}[active];$('#'+active).innerHTML=(result?`<div class="result" role="status">${esc(result)}</div>`:'')+fn()}
function foundryImport(raw){if(!raw||!raw.system||!raw.name)throw Error('This is not a Foundry Actor export');const f=raw.system,base=fresh();base.name=String(raw.name);merge(base.identity,f.identity||{});merge(base.character,f.character||{});merge(base.stats,f.stats||{});merge(base.combat,f.combat||{});merge(base.resources,f.resources||{});merge(base.lowFantasy,f.lowFantasy||{});merge(base.professions,f.professions||{});merge(base.skills,f.skills?.all||{});base.points.skill=n(f.Skill?.availablePoints);base.points.attribute=n(f.attributepoints?.availablePoints);base.points.talent=n(f.talents?.availablePoints);base.talents=Array.isArray(f.talents?.nodes)?f.talents.nodes.map(x=>({id:x.id||uid(),name:String(x.title||x.name||''),description:String(x.description||''),cost:n(x.cost,1),branch:String(x.branch||''),requiredLevel:n(x.requiredLevel),parentId:String(x.parentId||''),prerequisite:String(x.prerequisite||''),unlocked:!!x.unlocked,children:x.children||[]})):[];const flags=raw.flags?.thalimaras||{};if(Array.isArray(flags.notesState))base.notes=flags.notesState.map(x=>({title:String(x.title||'Note'),body:String(x.content||'')}));const ammo=f.combat?.ammunition?.entries;if(Array.isArray(ammo))base.combat.ammunition=ammo.map(x=>({name:String(x.name||'Ammunition'),count:n(x.count)}));base.inventory.capacity=n(f.inventory?.capacity,10);base.inventory.eversteelShards=n(f.inventory?.eversteelShards);/* Sheet mode is chosen by the player; the Actor JSON does not identify which sheet class was active. */const items=Array.isArray(raw.items)?raw.items:[];base.inventory.items=items.filter(x=>x?.name&&!x.system?.socketedTo).map(x=>({id:x._id||x.id||uid(),name:String(x.name),quantity:n(x.system?.quantity,1),type:String(x.type||'item'),description:String(x.system?.description||''),equippedSlot:x.system?.equipped?String(x.system?.equipmentSlot||''):''}));base.attacks=items.filter(x=>x.type==='weapon'||x.type==='ability').map(x=>({id:x._id||x.id||uid(),name:String(x.name||''),hitFormula:String(x.system?.hitFormula||'2d10'),hitModifier:n(x.system?.hitModifier),damageFormula:String(x.system?.damageFormula||'1d6'),description:String(x.system?.description||'')}));return base}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`thalminaras-${String(state.name||'character').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'character'}-phone.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);result='Backup downloaded';render(active)}
function clickAction(b){const act=b.dataset.act,idx=n(b.dataset.index),list=b.dataset.list,type=b.dataset.type;result='';switch(act){
case 'mode':state.combat.rollMode=b.dataset.value;break;
case 'category':category=b.dataset.value;break;
case 'resource-step':{const r=state.resources[b.dataset.name];r.value=clamp(n(r.value)+n(b.dataset.delta),0,Math.max(0,n(r.max)));break}
case 'fatigue':state.combat.fatigue[type]=clamp(n(state.combat.fatigue[type])+n(b.dataset.delta),0,3);break;
case 'ammo-step':state.combat.ammunition[idx].count=Math.max(0,n(state.combat.ammunition[idx].count)+n(b.dataset.delta));break;
case 'round':state.resources.actionPoints.value=n(state.resources.actionPoints.max);result='AP restored to maximum';break;
case 'rest':{for(const name of ['mana','focus'])state.resources[name].value=n(state.resources[name].max);result='Mana and Focus restored; Injuries must be recovered separately';break}
case 'apply-damage':{const damage=Math.max(0,n(state.lowFantasy.incomingDamage)),dt=n(state.lowFantasy.defense.armorRating)*2+n(state.stats.toughness.bonus)*2+n(state.lowFantasy.defense.bonusDR),added=damage<=dt?0:1+Math.floor((damage-dt)/5);state.lowFantasy.injuries.current=Math.max(0,n(state.lowFantasy.injuries.current)+added);result=added?`${damage} damage caused ${added} ${added===1?'Injury':'Injuries'}${state.lowFantasy.injuries.current>n(state.lowFantasy.injuries.limit)?' — resolve Last Stand manually':''}`:`${damage} damage did not exceed DT ${dt}`;break}
case 'add':{const dest=get(state,list);if(!Array.isArray(dest))break;const value=list==='attacks'?{id:uid(),name:'New attack',hitFormula:'2d10',hitModifier:0,damageFormula:'1d6',description:''}:list==='combat.ammunition'?{id:uid(),name:'Arrows',count:0}:list==='inventory.items'?{id:uid(),name:'New item',quantity:1,type:'item',description:'',equippedSlot:''}:list==='notes'?{title:'New note',body:''}:list==='talents'?{id:uid(),name:'New talent',cost:1,branch:'',requiredLevel:0,parentId:'',prerequisite:'',description:'',unlocked:false}:{name:'',description:''};dest.push(value);break}
case 'remove':{get(state,list)?.splice(idx,1);break}
case 'advance':{const s=state.skills[b.dataset.name],keys=Object.keys(RANKS),at=keys.indexOf(s.level);if(n(s.current)<n(s.max)||at>=keys.length-1){result='Progress target not met, or rank is already at maximum';break}const next=keys[at+1];s.level=next;s.current=0;s.max=RANKS[next][1];s.bonus=RANKS[next][0];result=`Advanced ${b.dataset.name} to ${next}`;break}
case 'recipe-add':{const p=state.professions[type];if(!Array.isArray(p.recipes))p.recipes=[];p.recipes.push({id:uid(),name:'New recipe',level:1,description:''});break}
case 'recipe-remove':state.professions[type].recipes?.splice(idx,1);break;
case 'unlock':{const t=state.talents[idx],cost=Math.max(0,n(t.cost,1));if(t.unlocked){result='Already unlocked';break}if(n(state.points.talent)<cost){result='Not enough Talent Points';break}if(n(t.requiredLevel)>n(state.identity.level)){result=`Requires level ${t.requiredLevel}`;break}if(t.parentId&&!state.talents.find(x=>x.id===t.parentId)?.unlocked){result='Unlock the previous talent first';break}t.unlocked=true;state.points.talent-=cost;result=`Unlocked ${t.name}`;break}
case 'skill':{const s=state.skills[b.dataset.name],penalty=n(state.lowFantasy.injuries.current);roll(b.dataset.name,'2d10',totalBonus(s)-penalty);return}
case 'attribute':roll(type[0].toUpperCase()+type.slice(1),'2d10',n(state.stats[type].bonus));return;
case 'initiative':roll('Initiative','2d10',n(state.combat.initiative),true);return;
case 'defense':{const c=state.combat,penalty=n(state.lowFantasy.injuries.current);roll(`${type} defense`,c[type+'Die'],n(c.passiveDefense)+n(c[type+'Skill'])-penalty);return}
case 'attack':{const a=state.attacks[idx],penalty=n(state.lowFantasy.injuries.current);roll(`${a.name} hit`,a.hitFormula||'2d10',n(a.hitModifier)-penalty,true);return}
case 'damage':{const a=state.attacks[idx];roll(`${a.name} damage`,a.damageFormula||'1d6');return}
case 'profession':{const p=state.professions[type]||{};roll(`${type} trade skill`,'2d10',n(p.skillBonus)+n(p.miscBonus));return}
case 'export':exportBackup();return;
case 'import':$('#importFile').click();return;
case 'reset':if(!confirm(`Reset ${state.name} in this browser? Export first if you need a backup.`))return;state=fresh();result='Character reset';break;
default:return}save();render(active)}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){result='';render(tab.dataset.tab);scrollTo({top:0,behavior:'instant'});return}const b=e.target.closest('[data-act]');if(b)clickAction(b)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.path){const value=el.type==='number'?n(el.value):el.value;set(state,el.dataset.path,value);save();if(el.dataset.path==='name'||el.dataset.path.startsWith('identity.')){$('#displayName').textContent=state.name;$('#subtitle').textContent=`${state.identity.ancestry} · Level ${state.identity.level} · Low Fantasy`}return}if(el.id==='skillSearch'){skillSearch=el.value;const pos=el.selectionStart;render('skills');const next=$('#skillSearch');next.focus();next.setSelectionRange(pos,pos)}if(el.id==='talentSearch'){talentSearch=el.value;const pos=el.selectionStart;render('talents');const next=$('#talentSearch');next.focus();next.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.equip){const x=el.dataset.equip,i=el.value;for(const it of state.inventory.items)if(it.equippedSlot===x)it.equippedSlot='';if(i!=='')state.inventory.items[n(i)].equippedSlot=x;save();render('equipment');return}if(el.dataset.path){if(el.dataset.path.endsWith('.level')&&el.dataset.path.startsWith('skills.')){const name=el.dataset.path.slice(7,-6),s=state.skills[name],rank=RANKS[s.level]||RANKS.None;s.bonus=rank[0];s.current=0;s.max=rank[1]}if(el.dataset.path==='identity.ancestry'||el.dataset.path==='lowFantasy.previousAncestry'){const ancestry=state.identity.ancestry.trim(),prior=state.lowFantasy.previousAncestry.trim(),base=ANCESTRY_INJ[ancestry==='Veilborn'?prior:ancestry];if(base&&n(state.lowFantasy.injuries.limit)===3)state.lowFantasy.injuries.limit=base}save();render(active)}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>8*1024*1024)throw Error('File exceeds 8 MB');const raw=JSON.parse(await file.text());const candidate=raw.schema===2?merge(fresh(),raw):foundryImport(raw);if(!confirm(`Replace ${state.name} in this browser with ${candidate.name}?`))return;state=candidate;delete state.slot;lowFantasyOnly();save();result='Character imported';render('character')}catch(err){result=`Import failed: ${err.message}`;render(active)}finally{e.target.value=''}});

load();render('combat');
})();

</script></body></html>
